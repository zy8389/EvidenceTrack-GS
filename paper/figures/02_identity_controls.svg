<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#26384a"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="35" y="45" font-family="Arial" font-size="26" font-weight="bold">Correct locality is not evidence of correct identity</text><rect x="80" y="100" width="370" height="300" fill="#f7f8fa" stroke="#26384a"/><rect x="165" y="160" width="200" height="180" fill="none" stroke="#26384a" stroke-dasharray="8 6"/><path d="M255,240 L275,240 M265,230 L265,250" stroke="#26384a" stroke-width="3"/><circle cx="315" cy="205" r="6" fill="#26384a"/><text x="305" y="188" font-family="Arial" font-size="16">proxy target</text><text x="210" y="277" font-family="Arial" font-size="16">projection center</text><rect x="600" y="105" width="325" height="70" rx="5" fill="#f4f6f8" stroke="#26384a" stroke-width="2"/><text x="762.5" y="147.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">Correct source identity</text><path d="M600,140 L455,140" stroke="#26384a" stroke-width="2" marker-end="url(#arrow)"/><rect x="600" y="215" width="325" height="70" rx="5" fill="#f4f6f8" stroke="#26384a" stroke-width="2"/><text x="762.5" y="257.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">Hard-wrong identity</text><path d="M600,250 L455,250" stroke="#26384a" stroke-width="2" marker-end="url(#arrow)"/><rect x="600" y="325" width="325" height="70" rx="5" fill="#f4f6f8" stroke="#26384a" stroke-width="2"/><text x="762.5" y="367.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="19">Random / uniform control</text><path d="M600,360 L455,360" stroke="#26384a" stroke-width="2" marker-end="url(#arrow)"/><text x="80" y="454" font-family="Arial" font-size="19">Same image, same candidate set; do not silently drop failed matches.</text><text x="80" y="491" font-family="Arial" font-size="17">Report: projection gain, enhancement gain, valid identity margin, PCK, failure rate.</text></svg>